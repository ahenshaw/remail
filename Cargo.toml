[package]
name = "remail"
version = "0.3.0"
edition = "2024"
description = "A fast IMAP and Gmail client with an egui interface"
repository = "https://github.com/ahenshaw/remail"
license = "MIT"
readme = "README.md"
keywords = ["email", "imap", "gmail", "egui"]
categories = ["email"]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
ammonia = "4"
anyhow = "1"
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
base64 = "0.23"
chrono = "0.4"
directories = "6"
eframe = "0.36"
egui = "0.36"
egui-elegance = "0.16"
egui_extras = "0.36"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
keyring = "4"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "pool", "tokio1", "tokio1-rustls-tls", "hostname"] }
mail-parser = "0.11"
open = "5"
percent-encoding = "2"
rand = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
webpki-roots = "1"
fontdb = { version = "0.24", default-features = false, features = ["fs", "memmap", "fontconfig"] }
