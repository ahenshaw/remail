name: Release

on:
  push:
    tags: ["v*"]
  # Lets the packaging be exercised without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgl1-mesa-dev dpkg-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A tag that disagrees with Cargo.toml would ship a package whose
      # version does not match its filename.
      - name: Check the tag against Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          crate=$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p')
          tag="${GITHUB_REF_NAME#v}"
          test "$crate" = "$tag" || {
              echo "tag $tag does not match Cargo.toml $crate" >&2
              exit 1
          }

      - run: cargo build --release
      - run: ./packaging/linux/build-deb.sh

      - name: Lint the package
        run: |
          sudo apt-get install --no-install-recommends -y lintian
          lintian dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  windows:
    name: Windows (installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release

      - name: Build the installer
        shell: pwsh
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          $version = [regex]::Match($manifest, '(?m)^version = "(.+?)"').Groups[1].Value
          Write-Host "packaging version $version"

          # Inno Setup ships in the runner image; install it if that changes.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
              choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$version" packaging\windows\remail.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe

  publish:
    name: Publish
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes artifacts/*
